# Roda os testes da Vatty em cada push e PR. Os testes usam dublês: sem rede, sem modelo, sem ffmpeg.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar a Vatty (com os extras de ata e apresentação, que têm testes próprios)
        run: python -m pip install -e ".[ata,apresentacao]"
      - name: Testes
        run: python -m unittest discover -s tests
