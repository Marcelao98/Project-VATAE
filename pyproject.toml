[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vatty"
version = "0.19.1"
description = "Vatty (Video Audio To Almost Everything): transforma vídeos, áudios e gravações em texto (legenda ou faster-whisper) e deixa agentes do Claude Code fazerem o resto. Filha do ouvido da Natty."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# numpy já vem com o faster-whisper; listado porque o código importa direto.
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy",
    # [default] traz o yt-dlp-ejs, que resolve o desafio JavaScript do YouTube. [curl-cffi] deixa o
    # yt-dlp imitar um navegador, que o TikTok exige (sem ele: "Unexpected response from webpage request").
    "yt-dlp[default,curl-cffi]",
]

[project.optional-dependencies]
# Gravação do PC: `pip install -e ".[gravacao]"`. Windows: PyAudioWPatch (som do PC e microfone).
# Linux: o áudio vem do PipeWire pelo ffmpeg (nada a instalar aqui); o jeepney fala com o portal do
# Wayland para gravar a tela.
gravacao = ["pyaudiowpatch; sys_platform == 'win32'", "jeepney; sys_platform == 'linux'"]
# Separação de falantes (--falantes e vatty perfil): `pip install -e ".[falantes]"`.
falantes = ["sherpa-onnx"]
# Ata de reunião em .docx e .pdf (`vatty ata`): `pip install -e ".[ata]"`.
ata = ["python-docx", "reportlab"]

[project.scripts]
vatty = "vatty.cli:main"
# apelido antigo, para não quebrar o que já estava em uso
ata = "vatty.cli:main"

[tool.setuptools.packages.find]
include = ["vatty*"]

# A interface (`vatty ui`) leva junto a tela: HTML, CSS, JS e as imagens da Vatty.
[tool.setuptools.package-data]
"vatty.ui" = ["static/*"]
